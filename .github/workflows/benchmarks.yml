name: Benchmarks & Resource Usage

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "perf/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Throughput, Memory & Arena Footprint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR / head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run Performance & Memory Allocation Benchmarks (Head)
        run: |
          set -o pipefail
          go test -run=^$ -bench=^Benchmark_ -benchmem -benchtime=10ms -count=6 ./... | tee benchmark-head.txt

      - name: Run otellru Submodule Benchmarks
        working-directory: otellru
        run: go test -run=^$ -bench=. -benchmem -benchtime=10ms -count=3 ./...

      - name: Run Base Branch Benchmarks for Regression Comparison (PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          trap 'git checkout "$HEAD_SHA"' EXIT
          git checkout "${{ github.event.pull_request.base.sha }}"
          go test -run=^$ -bench=^Benchmark_ -benchmem -benchtime=10ms -count=6 ./... | tee benchmark-base.txt
          git checkout "$HEAD_SHA"
          trap - EXIT
          sed -i 's|^pkg: .*|pkg: github.com/google/go-lru|' benchmark-base.txt
          benchstat benchmark-base.txt benchmark-head.txt | tee benchstat-comparison.txt

      - name: Enforce Performance Targets & Regression Thresholds
        run: |
          set -o pipefail
          if [ -f benchmark-base.txt ]; then
            go run ./cmd/benchcheck -base benchmark-base.txt -head benchmark-head.txt -strict-missing -format markdown -summary "$GITHUB_STEP_SUMMARY" | tee benchcheck-report.md
          else
            go run ./cmd/benchcheck -head benchmark-head.txt -strict-missing -format markdown -summary "$GITHUB_STEP_SUMMARY" | tee benchcheck-report.md
          fi

      - name: Publish benchstat Statistical Comparison Summary (PR only)
        if: always()
        run: |
          if [ -f benchstat-comparison.txt ]; then
            {
              echo ""
              echo "<details><summary>Full <code>benchstat</code> Statistical Comparison vs. Base</summary>"
              echo ""
              echo '```text'
              cat benchstat-comparison.txt
              echo '```'
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results
          path: |
            benchmark-head.txt
            benchmark-base.txt
            benchstat-comparison.txt
            benchcheck-report.md
          if-no-files-found: ignore
          retention-days: 30
