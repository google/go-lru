version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - revive
    - staticcheck
    - testifylint
    - thelper
    - unused
  settings:
    gocyclo:
      min-complexity: 15

formatters:
  enable:
    - gofmt
    - goimports
